  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f5f7fb;
  color: #1e1f2a;
  line-height: 1.5;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 280px;
  min-width: 280px;
  height: 100vh;
  background: #ffffff;
  border-right: 1px solid #e9ebf0;
  display: flex;
  flex-direction: column;
  padding: 28px 16px 24px 16px;
  box-shadow: 2px 0 12px rgba(0, 0, 0, 0.02);
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-left: 8px;
  margin-bottom: 32px;
}

.logo-icon {
  background: #2a5c8a;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 6px 10px rgba(42, 92, 138, 0.15);
}

.logo-text {
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.3px;
  color: #182c3c;
}

.logo-sub {
  font-size: 13px;
  font-weight: 400;
  color: #6b7a8a;
  margin-top: 2px;
}

.drop-zone {
  background: #f8fafd;
  border: 2px dashed #c8d8e8;
  border-radius: 16px;
  padding: 24px 14px;
  margin-bottom: 28px;
  transition: all 0.2s ease;
  cursor: pointer;
}

.drop-zone.drag-over {
  background: #e7f0fa;
  border-color: #2a5c8a;
}

.drop-zone:hover {
  border-color: #2a5c8a;
}

.drop-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.drop-icon {
  font-size: 32px;
  color: #6b8caa;
  margin-bottom: 4px;
}

.drop-text {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #4f6272;
}

.drop-primary {
  font-weight: 500;
}

.drop-secondary {
  color: #8a9aaa;
}

.browse-btn {
  color: #2a5c8a;
  font-weight: 500;
  cursor: pointer;
}

.browse-btn:hover {
  text-decoration: underline;
}

.drop-hint {
  font-size: 12px;
  color: #8a9aaa;
}

.nav-menu {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  font-weight: 500;
  font-size: 15px;
  color: #3e5060;
  transition: all 0.15s ease;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}

.nav-item i {
  width: 22px;
  font-size: 1.2rem;
  color: #60758b;
}

.nav-item:hover {
  background: #f0f4f9;
  color: #1e3b5c;
}

.nav-item.active {
  background: #e7f0fa;
  color: #1e4b6e;
  border-left: 4px solid #2a5c8a;
  border-radius: 14px 14px 14px 10px;
}

.nav-item.active i {
  color: #2a5c8a;
}

.nav-divider {
  height: 1px;
  background: #e3e8ef;
  margin: 12px 4px;
}

.sidebar-footer {
  margin-top: 20px;
  font-size: 12px;
  color: #8a9aaa;
  padding: 10px 8px;
  border-top: 1px dashed #d7dfe8;
}

.main {
  flex: 1;
  padding: 28px 32px;
  overflow-y: auto;
  background: #f5f7fb;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.header-left h1 {
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.5px;
  color: #132a3a;
}

.header-left .breadcrumb {
  font-size: 14px;
  color: #6b7f90;
  margin-top: 6px;
}

.header-actions {
  display: flex;
  gap: 12px;
}

.btn-outline {
  background: white;
  border: 1px solid #cfdde9;
  padding: 10px 18px;
  border-radius: 30px;
  font-weight: 500;
  font-size: 14px;
  color: #2f587b;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.02);
  cursor: pointer;
}

.btn-primary {
  background: #2a5c8a;
  border: none;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 500;
  font-size: 14px;
  color: white;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 6px 12px rgba(42, 92, 138, 0.2);
  cursor: pointer;
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}

.param-card {
  background: white;
  border-radius: 22px;
  padding: 20px 24px;
  margin-bottom: 28px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
  border: 1px solid #ebf0f6;
}

.param-title {
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #1e3b5c;
}

.param-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 24px 40px;
  align-items: flex-end;
}

.param-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.param-field label {
  font-size: 13px;
  font-weight: 500;
  color: #526e82;
}

.fake-select {
  background: #f9fbfd;
  border: 1px solid #d6e0ea;
  border-radius: 40px;
  padding: 10px 20px;
  font-size: 14px;
  min-width: 180px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #1f3a4e;
  cursor: default;
}

.fake-select i {
  color: #8da0b2;
  font-size: 14px;
}

.fake-select-control {
  background: #f9fbfd;
  border: 1px solid #d6e0ea;
  border-radius: 40px;
  padding: 10px 20px;
  font-size: 14px;
  min-width: 180px;
  color: #1f3a4e;
  outline: none;
}

.fake-select-control:focus {
  border-color: #2a5c8a;
  box-shadow: 0 0 0 2px rgba(42, 92, 138, 0.15);
}

.run-btn {
  background: #2a5c8a;
  color: white;
  border: none;
  padding: 10px 28px;
  border-radius: 40px;
  font-weight: 500;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
  cursor: pointer;
}
 
.chart-card {
  background: white;
  border-radius: 22px;
  padding: 18px 20px 8px 20px;
  margin-bottom: 28px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
  border: 1px solid #ebf0f6;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  padding: 0 8px;
}

.chart-header h3 {
  font-weight: 600;
  font-size: 18px;
  color: #1f3a4e;
}

.chart-tabs {
  display: flex;
  gap: 6px;
}

.tab {
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 13px;
  background: #f0f4fa;
  color: #3f607d;
  font-weight: 500;
  cursor: pointer;
}

.tab.active {
  background: #2a5c8a;
  color: white;
}

.chart-container {
  width: 100%;
  min-height: 100px;
}

.chart-container svg {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0 auto;
}

.py-output {
  background: #1e1f2a;
  color: #c9d1d9;
  padding: 20px;
  border-radius: 14px;
  font-size: 14px;
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  min-height: 80px;
  white-space: pre-wrap;
  overflow-x: auto;
  margin: 0;
}

.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 10px;
}

.metric-item {
  background: white;
  border-radius: 18px;
  padding: 18px 20px;
  border: 1px solid #ebf0f6;
  box-shadow: 0 4px 8px rgba(0,0,0,0.02);
}

.metric-label {
  font-size: 13px;
  font-weight: 500;
  color: #647e94;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.metric-value {
  font-size: 28px;
  font-weight: 600;
  color: #1a394e;
}

.table-preview {
  background: white;
  border-radius: 18px;
  padding: 16px 20px;
  border: 1px solid #ebf0f6;
  margin-top: 8px;
}

.preview-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-weight: 500;
  color: #335e7c;
}

.badge {
  background: #eef3f9;
  color: #1e4b6e;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 30px;
  font-size: 12px;
}

.simple-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.simple-table th {
  text-align: left;
  padding: 8px 6px 8px 0;
  color: #556f83;
  font-weight: 500;
  border-bottom: 1px solid #e2e9f0;
}

.simple-table td {
  padding: 8px 6px 8px 0;
  color: #25485e;
  border-bottom: 1px solid #f0f4f9;
}

.simple-table tr:last-child td {
  border-bottom: none;
}

.footer-note {
  margin-top: 22px;
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 13px;
  color: #436684;
}

.module-placeholder {
  background: white;
  border-radius: 22px;
  padding: 60px 40px;
  text-align: center;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
  border: 1px solid #ebf0f6;
}

.placeholder-icon {
  width: 80px;
  height: 80px;
  background: #e7f0fa;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
}

.placeholder-icon i {
  font-size: 36px;
  color: #2a5c8a;
}

.module-placeholder h2 {
  font-weight: 600;
  font-size: 24px;
  color: #132a3a;
  margin-bottom: 12px;
}

.module-placeholder p {
  color: #55738b;
  margin-bottom: 16px;
}

.module-placeholder ul {
  list-style: none;
  padding: 0;
}

.module-placeholder li {
  padding: 8px 0;
  color: #3e5060;
}

.dataset-card {
  background: #f8fafd;
  border-radius: 16px;
  padding: 16px 14px;
  margin-bottom: 28px;
  border: 1px solid #eef1f5;
  position: relative;
}

.cancel-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: transparent;
  border: none;
  color: #a0b0c0;
  cursor: pointer;
  padding: 4px;
  font-size: 12px;
}

.cancel-btn:hover {
  color: #e74c3c;
}

.dataset-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  font-size: 14px;
  color: #3a4a5a;
  margin-bottom: 10px;
}

.dataset-title i {
  color: #2a5c8a;
  font-size: 15px;
}

.dataset-detail {
  font-size: 13px;
  color: #4f6272;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}

.dataset-detail span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.badge-success {
  background: #e8f5e9;
  color: #2e7d32;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 30px;
  font-size: 12px;
}

.footer-info {
  margin-top: 16px;
  display: flex;
  gap: 20px;
  font-size: 13px;
}

.module-content {
  display: none;
}

.module-content.active {
  display: block;
}

.progress-bar-container {
  margin-top: 8px;
  display: none;
}

.progress-bar {
  height: 4px;
  background: #2a5c8a;
  border-radius: 4px;
  transition: width 0.3s ease;
}

.progress-text {
  font-size: 11px;
  color: #8a9aaa;
  margin-top: 2px;
}

.eval-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
}

.eval-tab {
  padding: 10px 24px;
  border-radius: 30px;
  font-weight: 500;
  font-size: 14px;
  color: #3e5060;
  background: #f0f4f9;
  border: none;
  cursor: pointer;
  transition: all 0.15s ease;
}

.eval-tab:hover {
  background: #e0e8f2;
}

.eval-tab.active {
  background: #2a5c8a;
  color: white;
}

.eval-panel {
  display: none;
}

.eval-panel.active {
  display: block;
}

.python-files {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.python-file-card {
  background: white;
  border-radius: 18px;
  border: 1px solid #ebf0f6;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.02);
}

.python-file-header {
  padding: 14px 20px;
  font-weight: 600;
  font-size: 15px;
  color: #1a394e;
  background: #f8fafd;
  border-bottom: 1px solid #ebf0f6;
  display: flex;
  align-items: center;
  gap: 10px;
}

.python-file-header i {
  color: #2a5c8a;
}

.python-file-header .badge {
  margin-left: auto;
}

.python-code {
  margin: 0;
  padding: 20px;
  background: #1e1f2a;
  font: 13px/1.6 'Cascadia Code', 'Fira Code', monospace;
  overflow-x: auto;
}

.python-code code {
  white-space: pre;
}

</style>
  <style>
    .sheet-selector {
      background: #f8fafd;
      border: 1px solid #eef1f5;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 28px;
    }
    .sheet-selector-title {
      font-size: 13px;
      font-weight: 500;
      color: #3a4a5a;
      margin-bottom: 10px;
    }
    .sheet-selector-title i {
      color: #2a5c8a;
      margin-right: 6px;
    }
    .sheet-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sheet-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #3e5060;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sheet-option:hover {
      background: #e7f0fa;
    }
    .sheet-option input[type="radio"] {
      accent-color: #2a5c8a;
    }
    .btn-confirm-sheet {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #2a5c8a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-confirm-sheet:hover {
      background: #1e4b6e;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-chart-scatter"></i></div>
        <div>
          <div class="logo-text">StatCore</div>
          <div class="logo-sub">多元统计分析·课程作业</div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-content">
          <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
          <div class="drop-text">
            <span class="drop-primary">拖拽文件到此处</span>
            <span class="drop-secondary">或</span>
            <label class="browse-btn">
              浏览文件<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
            </label>
          </div>
          <div class="drop-hint">支持 CSV、Excel 文件</div>
        </div>
      </div>

      <div id="sheetSelector" class="sheet-selector" style="display:none;">
        <div class="sheet-selector-title"><i class="fas fa-file-excel"></i> 选择要导入的工作表</div>
        <div id="sheetOptions" class="sheet-options"></div>
        <button id="confirmSheet" class="btn-confirm-sheet">确认导入</button>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-module="clustering"><i class="fas fa-layer-group"></i> 聚类分析</button>
        <button class="nav-item" data-module="visualization"><i class="fas fa-flask"></i> 可视化</button>
        <button class="nav-item" data-module="Evaluation"><i class="fas fa-chart-bar"></i> 统计评价</button>
        <button class="nav-item" data-module="pca"><i class="fas fa-arrow-down-wide-short"></i> 主成分分析</button>
        <button class="nav-item" data-module="factor"><i class="fas fa-cube"></i> 因子分析</button>
        <button class="nav-item" data-module="correspondence"><i class="fas fa-arrows-left-right"></i> 对应分析</button>
        <button class="nav-item" data-module="regression"><i class="fas fa-chart-line"></i> 相关与回归</button>
        <button class="nav-item" data-module="canonical"><i class="fas fa-link"></i> 典型相关</button>
        <button class="nav-item" data-module="extended"><i class="fas fa-plus-minus"></i> 扩展线性</button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-module="python"><i class="fas fa-code"></i> Python 代码</button>
      </nav>

      <div class="sidebar-footer">
        <i class="far fa-lightbulb"></i> 浏览器端 Python · Pyodide<br>
        <span style="opacity:0.7;">所有计算在本地 WebAssembly 中完成</span>
        <div class="py-status" style="margin-top:8px; font-size:12px; color:#8a9aaa;">
          <i class="fas fa-spinner fa-pulse"></i> 加载 Pyodide 中...
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
          <div class="progress-text"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="module-loading" style="text-align:center; padding:80px 20px; color:#8a9aaa;">
        <i class="fas fa-spinner fa-pulse fa-2x"></i>
        <p style="margin-top:16px;">加载模块中...</p>
      </div>
      <script>
window.MODULE_HTML = {
  "Evaluation": `<div class="module-content" id="Evaluation">
    <div class="page-header">
        <div class="header-left">
            <h1><i class="fas fa-chart-line"></i> 综合分析评价系统</h1>
            <div class="breadcrumb">
                <i class="fas fa-calculator"></i> 综合评价 / 综合分析
            </div>
        </div>
    </div>

    <!-- 方法选择卡片 -->
    <div class="param-card">
        <div class="param-title">
            <i class="fas fa-method"></i> 分析方法选择
        </div>
        <div class="method-selector">
            <label class="method-option" id="method-ahp">
                <input type="radio" name="method_type" value="ahp" data-param="method_type" checked>
                <div class="method-card">
                    <i class="fas fa-layer-group"></i>
                    <span class="method-name">层次分析法 (AHP)<br>基于判断矩阵的权重计算</span>
                    <!-- <span class="method-desc">基于判断矩阵的权重计算</span> -->
                </div>
            </label>
            <label class="method-option" id="method-comprehensive">
                <input type="radio" name="method_type" value="comprehensive" data-param="method_type">
                <div class="method-card">
                    <i class="fas fa-chart-pie"></i>
                    <span class="method-name">综合分析法<br>TOPSIS / 加权和 / 灰色关联</span>
                    <!-- <span class="method-desc">TOPSIS / 加权和 / 灰色关联</span> -->
                </div>
            </label>
        </div>
    </div>

    <!-- AHP专用参数 -->
    <div id="ahp-params" class="param-card method-params">
        <div class="param-title">

<span style="color: #959077"># 数据清洗</span>
<span style="color: #66D9EF">def</span><span style="color: #F8F8F2"> </span><span style="color: #A6E22E">_clean_series_numeric</span><span style="color: #F8F8F2">(series:</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">Series)</span> <span style="color: #FF4689">-&gt;</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">Series:</span>
<span style="color: #F8F8F2">    </span><span style="color: #E6DB74">&quot;&quot;&quot;</span>
<span style="color: #E6DB74">    向量化清洗单个 Series 中的数值格式：</span>

<span style="color: #E6DB74">    - 括号负数 -&gt; 负号</span>
<span style="color: #E6DB74">    &quot;&quot;&quot;</span>

    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">failed_mask</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">any():</span>

    <span style="color: #959077"># 2. 全角数字转半角</span>
    <span style="color: #F8F8F2">fullwidth_digits</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">maketrans(</span><span style="color: #E6DB74">&#39;０１２３４５６７８９&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&#39;0123456789&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">failed_vals</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">translate(fullwidth_digits)</span>

    <span style="color: #959077"># 5. 移除百分号并除以100</span>
    <span style="color: #F8F8F2">pct_mask</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">contains(</span><span style="color: #E6DB74">r&#39;%&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">na</span><span style="color: #FF4689">=</span><span style="color: #66D9EF">False</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">failed_vals</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">replace(</span><span style="color: #E6DB74">r&#39;%&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&#39;&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">regex</span><span style="color: #FF4689">=</span><span style="color: #66D9EF">True</span><span style="color: #F8F8F2">)</span>
    
    <span style="color: #959077"># 6. 移除千位分隔符（逗号）和空格（只移除数字内部的空格，保守处理）</span>
    <span style="color: #F8F8F2">failed_vals</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">replace(</span><span style="color: #E6DB74">&#39;,&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&#39;&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">regex</span><span style="color: #FF4689">=</span><span style="color: #66D9EF">False</span><span style="color: #F8F8F2">)</span>

<span style="color: #66D9EF">def</span><span style="color: #F8F8F2"> </span><span style="color: #A6E22E">clean_dataframe</span><span style="color: #F8F8F2">(</span>
    <span style="color: #F8F8F2">df:</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame,</span>
    <span style="color: #F8F8F2">name_col_index:</span> <span style="color: #F8F8F2">Union[int,</span> <span style="color: #F8F8F2">str]</span> <span style="color: #FF4689">=</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span>

    <span style="color: #F8F8F2">standardize:</span> <span style="color: #F8F8F2">bool</span> <span style="color: #FF4689">=</span> <span style="color: #66D9EF">True</span>
<span style="color: #F8F8F2">)</span> <span style="color: #FF4689">-&gt;</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame:</span>
<span style="color: #F8F8F2">    </span><span style="color: #E6DB74">&quot;&quot;&quot;</span>
<span style="color: #E6DB74">    清洗数据框中的数值列，保留一列标识列（如名称）。</span>
<span style="color: #E6DB74"> </span>

<span style="color: #E6DB74">    &quot;&quot;&quot;</span>
    <span style="color: #959077"># 标识列处理</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">isinstance(name_col_index,</span> <span style="color: #F8F8F2">str):</span>
        <span style="color: #F8F8F2">name_col</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_col_index</span>

    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">name_col</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns[name_col_index]</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[[name_col]]</span>
        <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns)</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">!=</span> <span style="color: #F8F8F2">name_col_index]</span>

    <span style="color: #959077"># 向量化转换数值列</span>

        <span style="color: #F8F8F2">numeric_df[col]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">_clean_series_numeric(df[col])</span>

    <span style="color: #959077"># 缺失值处理</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">missing_strategy</span> <span style="color: #FF4689">==</span> <span style="color: #E6DB74">&quot;drop&quot;</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">dropna()</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_data</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index]</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">imputer</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">SimpleImputer(strategy</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">missing_strategy)</span>
        <span style="color: #F8F8F2">numeric_array</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">imputer</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(numeric_df)</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(numeric_array,</span> <span style="color: #F8F8F2">columns</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns,</span> <span style="color: #F8F8F2">index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>

    <span style="color: #F8F8F2">nan_rows_before</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">isna()</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">any(axis</span><span style="color: #FF4689">=</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">)</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">sum()</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">nan_rows_before</span> <span style="color: #FF4689">&gt;</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">dropna()</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_data</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index]</span>
        <span style="color: #F8F8F2">print(</span><span style="color: #E6DB74">f&quot;警告：填充后仍有 {</span><span style="color: #F8F8F2">nan_rows_before</span><span style="color: #E6DB74">} 行包含 NaN，已删除。&quot;</span><span style="color: #F8F8F2">)</span>

        <span style="color: #F8F8F2">scaler</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">StandardScaler()</span>
        <span style="color: #F8F8F2">numeric_array</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">scaler</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(numeric_df)</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(numeric_array,</span> <span style="color: #F8F8F2">columns</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns,</span> <span style="color: #F8F8F2">index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>

        <span style="color: #66D9EF">except</span> <span style="color: #A6E22E">Exception</span><span style="color: #F8F8F2">:</span>
            <span style="color: #66D9EF">continue</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">df</span> <span style="color: #FF4689">is</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">:</span>
        <span style="color: #66D9EF">raise</span> <span style="color: #A6E22E">ValueError</span><span style="color: #F8F8F2">(</span><span style="color: #E6DB74">f&quot;无法读取文件: {</span><span style="color: #F8F8F2">input_path</span><span style="color: #E6DB74">}&quot;</span><span style="color: #F8F8F2">)</span>

import os
import re
from typing import Union

import numpy as np
import pandas as pd
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import StandardScaler


# 数据清洗
def _clean_series_numeric(series: pd.Series) -> pd.Series:
    """
    向量化清洗单个 Series 中的数值格式：
    - 货币符号（$€¥£₹等）
    - 百分号（转除以100）
    - 千位分隔符（逗号、空格）
    - 全角数字、全角负号/小数点
    - 括号负数 -> 负号
    """
    # 先尝试直接转为数值
    numeric = pd.to_numeric(series, errors='coerce', downcast='float')
    
    # 未被转换成功的索引
    failed_mask = numeric.isna() & series.notna()
    if not failed_mask.any():
        return numeric
    
    # 对失败的条目进行字符串清理
    failed_vals = series[failed_mask].astype(str).str.strip()
    
    # 1. 全角负号和小数点映射
    fullwidth_map = str.maketrans('－．', '-.')
    failed_vals = failed_vals.str.translate(fullwidth_map)
    
    # 2. 全角数字转半角
    fullwidth_digits = str.maketrans('０１２３４５６７８９', '0123456789')
    failed_vals = failed_vals.str.translate(fullwidth_digits)
    
    # 3. 移除货币符号
    currency_pattern = r'[$€¥£₹]'
    failed_vals = failed_vals.str.replace(currency_pattern, '', regex=True)
    
    # 4. 处理括号负数： (123.45) -> -123.45
    failed_vals = failed_vals.str.replace(r'^\((.*)\)$', r'-\1', regex=True)
    
    # 5. 移除百分号并除以100
    pct_mask = failed_vals.str.contains(r'%', na=False)
    failed_vals = failed_vals.str.replace(r'%', '', regex=True)
    
    # 6. 移除千位分隔符（逗号）和空格（只移除数字内部的空格，保守处理）
    failed_vals = failed_vals.str.replace(',', '', regex=False)
    failed_vals = failed_vals.str.replace(' ', '', regex=False)
    
    # 第二次转数值
    cleaned_numeric = pd.to_numeric(failed_vals, errors='coerce', downcast='float')
    
    # 百分比除以100
    if pct_mask.any():
        # pct_mask 索引对应原始 failed_mask 内的子集，需要对齐
        # 在 cleaned_numeric 上，根据原始的带%标记来调整
        pct_mask_full = failed_mask.copy()
        pct_mask_full[failed_mask] = pct_mask
        numeric.loc[pct_mask_full] = cleaned_numeric.loc[pct_mask] / 100.0
    else:
        numeric.loc[failed_mask] = cleaned_numeric
    
    return numeric


def clean_dataframe(
    df: pd.DataFrame,
    name_col_index: Union[int, str] = 0,
    missing_strategy: str = "mean",
    standardize: bool = True
) -> pd.DataFrame:
    """
    清洗数据框中的数值列，保留一列标识列（如名称）。
 
    参数:
        df: 原始 DataFrame
        name_col_index: 标识列的索引（整数位置）或列名
        missing_strategy: 缺失值处理策略，'drop' 或 sklearn SimpleImputer 支持的策略
        standardize: 是否标准化

    返回: clean_df
    """
    # 标识列处理
    if isinstance(name_col_index, str):
        name_col = name_col_index
        name_data = df[[name_col]]
        numeric_cols = [c for c in df.columns if c != name_col]
    else:
        name_col = df.columns[name_col_index]
        name_data = df[[name_col]]
        numeric_cols = [c for i, c in enumerate(df.columns) if i != name_col_index]

    # 向量化转换数值列
    numeric_df = pd.DataFrame(index=df.index)
    for col in numeric_cols:
        numeric_df[col] = _clean_series_numeric(df[col])

    # 缺失值处理
    if missing_strategy == "drop":
        numeric_df = numeric_df.dropna()
        name_data = name_data.loc[numeric_df.index]
    else:
        imputer = SimpleImputer(strategy=missing_strategy)
        numeric_array = imputer.fit_transform(numeric_df)
        numeric_df = pd.DataFrame(numeric_array, columns=numeric_df.columns, index=numeric_df.index)
   
    # 删除填充后残留的空缺值
    nan_rows_before = numeric_df.isna().any(axis=1).sum()
    if nan_rows_before > 0:
        numeric_df = numeric_df.dropna()
        name_data = name_data.loc[numeric_df.index]
        print(f"警告：填充后仍有 {nan_rows_before} 行包含 NaN，已删除。")

    # 标准化
    if standardize:
        scaler = StandardScaler()
        numeric_array = scaler.fit_transform(numeric_df)
        numeric_df = pd.DataFrame(numeric_array, columns=numeric_df.columns, index=numeric_df.index)
        result = pd.concat([name_data, numeric_df], axis=1)
    else:
        result = pd.concat([name_data, numeric_df], axis=1)

    return result


def auto_clean(input_path: str, output_path: str = None) -> str:
    """从 input_path 读 CSV，自动清洗后写入 output_path。

    自动检测编码与分隔符，先做类型转换（clean_to_numeric），
    再用均值填补缺失值（不做标准化）。

    返回: output_path
    """
    df = None
    for enc in ("utf-8", "utf-8-sig", "gbk", "gb18030"):
        try:
            df = pd.read_csv(input_path, encoding=enc, sep=None, engine="python")
            break
        except Exception:
            continue
    if df is None:
        raise ValueError(f"无法读取文件: {input_path}")

    cleaned = clean_dataframe(df, standardize=False)
    if output_path is None:
        base, ext = os.path.splitext(input_path)
        output_path = f"{base}.cleaned{ext}"
    cleaned.to_csv(output_path, index=False, encoding="utf-8-sig")
    return output_path

  <script type="text/python-src" data-module="Clustering">
import io
from typing import Dict, List, Tuple

import numpy as np
import pandas as pd
import matplotlib.pyplot as plt
from scipy.cluster.hierarchy import linkage, fcluster, dendrogram
from sklearn.cluster import KMeans
from sklearn.metrics import silhouette_score, calinski_harabasz_score, davies_bouldin_score


HIERARCHICAL_METHODS = ["single", "complete", "average", "centroid", "median", "ward"]


def _read_numeric_data(data_path: str) -> Tuple[pd.DataFrame, np.ndarray]:
    df = pd.read_csv(data_path)
    num_df = df.select_dtypes(include=[np.number]).dropna(axis=0)
    if num_df.empty:
        raise ValueError("未检测到可用于聚类的数值列，请上传包含数值列的 CSV/Excel。")
    return df, num_df.to_numpy(dtype=float)


def _standardize(x: np.ndarray) -> np.ndarray:
    mean = x.mean(axis=0, keepdims=True)
    std = x.std(axis=0, keepdims=True)
    std[std == 0] = 1.0
    return (x - mean) / std


def _pca2(x: np.ndarray) -> np.ndarray:
    x0 = x - x.mean(axis=0, keepdims=True)
    cov = np.cov(x0, rowvar=False)
    eigvals, eigvecs = np.linalg.eigh(cov)
    order = np.argsort(eigvals)[::-1]
    pc = eigvecs[:, order[:2]]
    return x0 @ pc


def _svg_scatter(points2d: np.ndarray, labels: np.ndarray, title: str) -> str:
    fig, ax = plt.subplots(figsize=(8, 5))
    unique = np.unique(labels)
    for k in unique:
        idx = labels == k
        ax.scatter(points2d[idx, 0], points2d[idx, 1], s=36, alpha=0.85, label=f"Cluster {int(k)}")
    ax.set_title(title)
    ax.set_xlabel("PC1")
    ax.set_ylabel("PC2")
    ax.legend(loc="best", fontsize=8)
    ax.grid(alpha=0.2)
    buf = io.BytesIO()
    fig.tight_layout()
    fig.savefig(buf, format="svg")
    plt.close(fig)
    return buf.getvalue().decode("utf-8")


def _svg_dendrogram(z: np.ndarray, title: str) -> str:
    fig, ax = plt.subplots(figsize=(9, 5))
    dendrogram(z, ax=ax, leaf_rotation=0, leaf_font_size=10)
    ax.set_title(title)
    ax.set_xlabel("Samples")
    ax.set_ylabel("Distance")
    buf = io.BytesIO()
    fig.tight_layout()
    fig.savefig(buf, format="svg")
    plt.close(fig)
    return buf.getvalue().decode("utf-8")


def _safe_metrics(x: np.ndarray, labels: np.ndarray) -> Dict[str, str]:
    unique = np.unique(labels)
    if unique.size < 2:
        return {
            "silhouette": "N/A",
            "ch": "N/A",
            "db": "N/A",
            "inertia": "N/A",
        }
    sil = silhouette_score(x, labels)
    ch = calinski_harabasz_score(x, labels)
    db = davies_bouldin_score(x, labels)
    return {
        "silhouette": f"{sil:.4f}",
        "ch": f"{ch:.2f}",
        "db": f"{db:.4f}",
        "inertia": "N/A",
    }


def _kmeans_fit(
    x_std: np.ndarray,
    n_clusters: int = 3,
    init: str = "k-means++",
    max_iter: int = 300,
    algorithm: str = "lloyd",
    random_state: int = 42,
):
    model = KMeans(
        n_clusters=n_clusters,
        init=init,
        max_iter=max_iter,
        algorithm=algorithm,
        random_state=random_state,
        n_init=10,
    )
    labels = model.fit_predict(x_std)
    centers = model.cluster_centers_
    return model, labels, centers


def _cluster_table_from_centers(labels: np.ndarray, centers: np.ndarray) -> Tuple[List[str], List[List[str]]]:
    header = ["簇", "样本数"] + [f"中心{i + 1}" for i in range(centers.shape[1])]
    rows: List[List[str]] = []
    for cid in range(centers.shape[0]):
        count = int(np.sum(labels == cid))
        row = [str(cid + 1), str(count)] + [f"{v:.4f}" for v in centers[cid]]
        rows.append(row)
    return header, rows


def analyze(options=None) -> Dict[str, object]:
    if options is not None and not isinstance(options, dict):
        to_py = getattr(options, "to_py", None)
        if callable(to_py):
            options = to_py()

    algorithm = "kmeans"
    n_clusters = 3
    init = "k-means++"
    max_iter = 300
    loss = "lloyd"
    plot_type = "scatter"
    data_path = None

    if isinstance(options, dict):
        algorithm = str(options.get("algorithm", algorithm)).strip().lower()
        n_clusters = int(options.get("n_clusters", n_clusters))
        init = options.get("init", init)
        max_iter = int(options.get("max_iter", max_iter))
        loss = str(options.get("loss", "lloyd")).strip().lower()
        plot_type = str(options.get("plot_type", "scatter")).strip().lower()
        data_path = options.get("data_path")

    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

    dataset_list = _prepare_datasets(data_path)
    n_clusters = max(2, int(n_clusters))
    max_iter = max(10, int(max_iter))
    algorithm = str(algorithm).strip().lower()
    if algorithm == "kmeans":
        plot_type = "scatter"

    svgs: List[str] = []
    summary_rows: List[List[str]] = []
    metrics_first: Dict[str, str] = {"silhouette": "--", "ch": "--", "db": "--", "inertia": "--"}
    detail_header: List[str] = []
    detail_rows: List[List[str]] = []
    kmeans_rows_raw: List[Tuple[str, int, int, List[float]]] = []
    kmeans_max_dim = 0

    for idx, (sheet_label, x) in enumerate(dataset_list):
        x_std = _standardize(x)
        x2 = _pca2(x_std)

        if algorithm == "kmeans":
            km_algo = loss if loss in {"lloyd", "elkan"} else "lloyd"
            model, labels, centers = _kmeans_fit(
                x_std,
                n_clusters=n_clusters,
                init=init,
                max_iter=max_iter,
                algorithm=km_algo,
            )
            metrics = _safe_metrics(x_std, labels)
            metrics["inertia"] = f"{model.inertia_:.4f}"
            svgs.append(_svg_scatter(x2, labels + 1, f"{sheet_label} - KMeans Clustering (K={n_clusters})"))
            summary_rows.append([sheet_label, metrics["silhouette"], metrics["ch"], metrics["db"], metrics["inertia"]])
            if idx == 0:
                metrics_first = metrics
            kmeans_max_dim = max(kmeans_max_dim, centers.shape[1])
            for cid in range(centers.shape[0]):
                count = int(np.sum(labels == cid))
                kmeans_rows_raw.append((sheet_label, cid + 1, count, [float(v) for v in centers[cid]]))
            continue

        if algorithm == "hierarchical":
            method = loss if loss in HIERARCHICAL_METHODS else "ward"
            z = linkage(x_std, method=method)
            labels = fcluster(z, t=n_clusters, criterion="maxclust")
            metrics = _safe_metrics(x_std, labels)
            if plot_type == "dendrogram":
                svgs.append(_svg_dendrogram(z, f"{sheet_label} - Dendrogram ({method})"))
            else:
                svgs.append(_svg_scatter(x2, labels, f"{sheet_label} - Hierarchical Clustering ({method}) (K={n_clusters})"))
            summary_rows.append([sheet_label, metrics["silhouette"], metrics["ch"], metrics["db"], "N/A"])
            counts = [int(np.sum(labels == k)) for k in sorted(np.unique(labels))]
            rows = [[method, str(i + 1), str(c)] for i, c in enumerate(counts)]
            if idx == 0:
                metrics_first = metrics
                detail_header = ["sheet", "方法", "簇编号", "样本数"]
            detail_rows.extend([[sheet_label] + r for r in rows])
            continue

        raise ValueError(f"未知算法: {algorithm}")

    if algorithm == "kmeans":
        detail_header = ["sheet", "簇", "样本数"] + [f"中心{i + 1}" for i in range(kmeans_max_dim)]
        for sheet_label, cluster_id, sample_count, center_vals in kmeans_rows_raw:
            center_strs = [f"{v:.4f}" for v in center_vals]
            if len(center_strs) < kmeans_max_dim:
                center_strs.extend([""] * (kmeans_max_dim - len(center_strs)))
            detail_rows.append([sheet_label, str(cluster_id), str(sample_count)] + center_strs)

    summary_header = ["sheet", "轮廓系数", "CH 指数", "DB 指数", "簇内平方和"]
    return {
        "svg": svgs[0] if svgs else "",
        "svgs": svgs,
        "metrics": metrics_first,
        "tables": [
            {"header": detail_header or ["sheet", "信息"], "rows": detail_rows or [["-", "无结果"]]},
            {"header": summary_header, "rows": summary_rows},
        ],
    }


def _prepare_datasets(data_path: str) -> List[Tuple[str, np.ndarray]]:
    df = pd.read_csv(data_path)
    num_df = df.select_dtypes(include=[np.number]).dropna(axis=0)
    if num_df.empty:
        raise ValueError("未检测到可用于聚类的数值列。")
    return [("data", num_df.to_numpy(dtype=float))]


def hierarchical(method: str = "ward", n_clusters: int = 3, data_path: str = None) -> Dict[str, object]:
    if not data_path:
        return {"error": "请先上传数据文件"}
    method = method.lower().strip()
    if method not in HIERARCHICAL_METHODS:
        raise ValueError(f"method 必须为 {HIERARCHICAL_METHODS} 之一")
    _, x = _read_numeric_data(data_path)
    x_std = _standardize(x)
    x2 = _pca2(x_std)
    z = linkage(x_std, method=method)
    labels = fcluster(z, t=n_clusters, criterion="maxclust")
    metrics = _safe_metrics(x_std, labels)
    counts = [int(np.sum(labels == k)) for k in sorted(np.unique(labels))]
    header = ["方法", "簇编号", "样本数"]
    rows = [[method, str(i + 1), str(c)] for i, c in enumerate(counts)]
    return {
        "svg": _svg_scatter(x2, labels, f"系统聚类({method}) 结果 (K={n_clusters})"),
        "metrics": metrics,
        "tables": [{"header": header, "rows": rows}],
    }


def analyze_all_methods(n_clusters: int = 3, data_path: str = None) -> Dict[str, object]:
    if not data_path:
        return {"error": "请先上传数据文件"}
    _, x = _read_numeric_data(data_path)
    x_std = _standardize(x)

    results: List[List[str]] = []
    for method in HIERARCHICAL_METHODS:
        z = linkage(x_std, method=method)
        labels = fcluster(z, t=n_clusters, criterion="maxclust")
        m = _safe_metrics(x_std, labels)
        results.append([method, m["silhouette"], m["ch"], m["db"], "N/A"])

    km, labels, _ = _kmeans_fit(x_std, n_clusters=n_clusters)
    m = _safe_metrics(x_std, labels)
    results.append(["kmeans", m["silhouette"], m["ch"], m["db"], f"{km.inertia_:.4f}"])

    return {
        "tables": [{"header": ["方法", "轮廓系数", "CH 指数", "DB 指数", "簇内平方和"], "rows": results}],
    }

  <script type="text/python-src" data-module="CorrelationRegression">
import io
import re
from typing import Dict, List, Tuple

import matplotlib.pyplot as plt
import numpy as np
import pandas as pd
import scipy.stats as st


EPS = 1e-12


def _to_py_dict(options):
    if options is None:
        return {}
    if isinstance(options, dict):
        return options
    to_py = getattr(options, "to_py", None)
    if callable(to_py):
        return to_py()
    return dict(options)


def _split_columns(value) -> List[str]:
    if value is None:
        return []
    if isinstance(value, (list, tuple)):
        return [str(v).strip() for v in value if str(v).strip()]
    text = str(value).strip()
    if not text:
        return []
    return [part.strip() for part in re.split(r"[,，、;；\s]+", text) if part.strip()]


def _fmt_float(value, digits: int = 4) -> str:
    try:
        v = float(value)
    except Exception:
        return "-"
    if not np.isfinite(v):
        if np.isposinf(v):
            return "inf"
        if np.isneginf(v):
            return "-inf"
        return "-"
    return f"{v:.{digits}f}"


def _fmt_p(value) -> str:
    try:
        v = float(value)
    except Exception:
        return "-"
    if not np.isfinite(v):
        return "-"
    if v < 0.001:
        return "<0.001"
    return f"{v:.4f}"


def _stars(p_value: float) -> str:
    if not np.isfinite(p_value):
        return "-"
    if p_value <= 0.001:
        return "***"
    if p_value <= 0.01:
        return "**"
    if p_value <= 0.05:
        return "*"
    return ""


def _fig_to_svg(fig) -> str:
    buf = io.BytesIO()
    fig.tight_layout()
    fig.savefig(buf, format="svg")
    plt.close(fig)
    return buf.getvalue().decode("utf-8")


def _read_selected_data(data_path: str, y_col: str, x_cols: List[str]) -> Tuple[pd.DataFrame, List[str], int]:
    try:
        df = pd.read_csv(data_path)
    except Exception as exc:
        raise ValueError(f"读取数据失败: {exc}")

    df = df.rename(columns=lambda c: str(c).strip())
    y_col = str(y_col).strip()
    x_cols = [str(c).strip() for c in x_cols]
    selected = [y_col] + x_cols

    missing = [c for c in selected if c not in df.columns]
    if missing:
        raise ValueError(f"数据中找不到列: {', '.join(missing)}")

    numeric = pd.DataFrame(index=df.index)
    bad_cols = []
    for col in selected:
        numeric[col] = pd.to_numeric(df[col], errors="coerce")
        if numeric[col].notna().sum() == 0:
            bad_cols.append(col)
    if bad_cols:
        raise ValueError(f"以下列无法转换为数值: {', '.join(bad_cols)}")

    before = len(numeric)
    numeric = numeric.dropna(axis=0, how="any")
    dropped = before - len(numeric)
    if len(numeric) < 3:
        raise ValueError("有效样本数不足，至少需要 3 行完整数值数据。")

    constant_cols = [col for col in selected if numeric[col].max() - numeric[col].min() <= EPS]
    if constant_cols:
        raise ValueError(f"以下列为常量列，无法进行相关或回归分析: {', '.join(constant_cols)}")

    return numeric, selected, dropped


def _correlation_table(data: pd.DataFrame, cols: List[str]) -> Dict[str, object]:
    rows = []
    header = ["变量"] + cols
    for i, row_col in enumerate(cols):
        row = [row_col]
        for j, col in enumerate(cols):
            if i == j:
                row.append("------")
            elif i > j:
                r, _ = st.pearsonr(data[row_col], data[col])
                row.append(_fmt_float(r, 4))
            else:
                _, p_value = st.pearsonr(data[row_col], data[col])
                star = _stars(p_value)
                row.append(star if star else _fmt_p(p_value))
        rows.append(row)
    return {"header": header, "rows": rows}


def _plot_correlation_heatmap(data: pd.DataFrame, cols: List[str]) -> str:
    corr = data[cols].corr().to_numpy(dtype=float)
    fig, ax = plt.subplots(figsize=(7.5, 6))
    im = ax.imshow(corr, cmap="RdBu_r", vmin=-1, vmax=1)
    fig.colorbar(im, ax=ax, fraction=0.046, pad=0.04)
    ax.set_xticks(range(len(cols)))
    ax.set_yticks(range(len(cols)))
    ax.set_xticklabels(cols, rotation=45, ha="right")
    ax.set_yticklabels(cols)
    ax.set_title("Pearson 相关系数矩阵")
    for i in range(len(cols)):
        for j in range(len(cols)):
            ax.text(j, i, f"{corr[i, j]:.2f}", ha="center", va="center", fontsize=9, color="#1f2d3d")
    return _fig_to_svg(fig)


def _fit_ols(y: np.ndarray, x: np.ndarray, x_names: List[str], alpha: float) -> Dict[str, object]:
    y = np.asarray(y, dtype=float).reshape(-1)
    x = np.asarray(x, dtype=float)
    if x.ndim == 1:
        x = x.reshape(-1, 1)

    n = y.shape[0]
    p = x.shape[1]
    k = p + 1
    df_resid = n - k
    if p < 1:
        raise ValueError("至少需要 1 个自变量。")
    if df_resid <= 0:
        raise ValueError(f"有效样本数不足：n={n}，模型参数数={k}，无法进行显著性检验。")

    design = np.column_stack([np.ones(n), x])
    rank = np.linalg.matrix_rank(design)
    if rank < k:
        raise ValueError("自变量之间存在完全共线性，无法估计完整回归模型。")

    xtx = design.T @ design
    xtx_inv = np.linalg.inv(xtx)
    beta = np.linalg.lstsq(design, y, rcond=None)[0]
    fitted = design @ beta
    resid = y - fitted

    y_bar = y.mean()
    sse = float(np.sum(resid ** 2))
    sst = float(np.sum((y - y_bar) ** 2))
    ssr = float(np.sum((fitted - y_bar) ** 2))
    mse = sse / df_resid
    rmse = float(np.sqrt(max(mse, 0.0)))
    r2 = 1.0 - sse / sst if sst > EPS else np.nan
    adj_r2 = 1.0 - (1.0 - r2) * (n - 1) / df_resid if np.isfinite(r2) else np.nan

    cov = mse * xtx_inv
    se = np.sqrt(np.maximum(np.diag(cov), 0.0))
    with np.errstate(divide="ignore", invalid="ignore"):
        t_values = beta / se
    p_values = np.array([2 * st.t.sf(abs(t), df_resid) if np.isfinite(t) else 0.0 for t in t_values])
    t_crit = st.t.ppf(1 - alpha / 2, df_resid)
    ci_low = beta - t_crit * se
    ci_high = beta + t_crit * se

    if p > 0 and mse > EPS:
        f_value = (ssr / p) / mse
        f_p = st.f.sf(f_value, p, df_resid)
    elif p > 0 and sse <= EPS:
        f_value = np.inf
        f_p = 0.0
    else:
        f_value = np.nan
        f_p = np.nan

    sigma2 = max(sse / n, EPS)
    aic = n * np.log(sigma2) + 2 * k
    bic = n * np.log(sigma2) + np.log(n) * k
    leverage = np.sum((design @ xtx_inv) * design, axis=1)
    denom = np.sqrt(np.maximum(mse * (1 - leverage), EPS))
    std_resid = resid / denom
    condition_number = float(np.linalg.cond(design))

    return {
        "n": n,
        "p": p,
        "k": k,
        "df_model": p,
        "df_resid": df_resid,
        "x_names": x_names,
        "beta": beta,
        "se": se,
        "t": t_values,
        "p_values": p_values,
        "ci_low": ci_low,
        "ci_high": ci_high,
        "fitted": fitted,
        "resid": resid,
        "std_resid": std_resid,
        "sse": sse,
        "ssr": ssr,
        "sst": sst,
        "mse": mse,
        "rmse": rmse,
        "r2": r2,
        "adj_r2": adj_r2,
        "multiple_r": float(np.sqrt(max(r2, 0.0))) if np.isfinite(r2) else np.nan,
        "f": f_value,
        "f_p": f_p,
        "aic": float(aic),
        "bic": float(bic),
        "condition_number": condition_number,
    }


def _coefficient_table(model: Dict[str, object], alpha: float) -> Dict[str, object]:
    names = ["Intercept"] + list(model["x_names"])
    rows = []
    for i, name in enumerate(names):
        rows.append([
            name,
            _fmt_float(model["beta"][i], 4),
            _fmt_float(model["se"][i], 4),
            _fmt_float(model["t"][i], 4),
            _fmt_p(model["p_values"][i]),
            _fmt_float(model["ci_low"][i], 4),
            _fmt_float(model["ci_high"][i], 4),
        ])
    ci_label = f"{int(round((1 - alpha) * 100))}% CI"
    return {"header": ["项", "估计值", "标准误", "t", "p", f"{ci_label} 下限", f"{ci_label} 上限"], "rows": rows}


def _summary_table(model: Dict[str, object], y_col: str) -> Dict[str, object]:
    rows = [
        ["因变量", y_col],
        ["有效样本数", str(model["n"])],
        ["自变量数", str(model["p"])],
        ["残差自由度", str(model["df_resid"])],
        ["R²", _fmt_float(model["r2"], 4)],
        ["调整 R²", _fmt_float(model["adj_r2"], 4)],
        ["复相关 R", _fmt_float(model["multiple_r"], 4)],
        ["F 统计量", _fmt_float(model["f"], 4)],
        ["F 检验 p 值", _fmt_p(model["f_p"])],
        ["RMSE", _fmt_float(model["rmse"], 4)],
        ["SSE", _fmt_float(model["sse"], 4)],
        ["AIC", _fmt_float(model["aic"], 4)],
        ["BIC", _fmt_float(model["bic"], 4)],
        ["条件数", _fmt_float(model["condition_number"], 2)],
    ]
    return {"header": ["指标", "值"], "rows": rows}


def _nested_model_table(data: pd.DataFrame, y_col: str, x_cols: List[str], alpha: float) -> Dict[str, object]:
    y = data[y_col].to_numpy(dtype=float)
    rows = []
    for i in range(1, len(x_cols) + 1):
        names = x_cols[:i]
        try:
            model = _fit_ols(y, data[names].to_numpy(dtype=float), names, alpha)
            rows.append([
                f"M{i}",
                " + ".join(names),
                _fmt_float(model["r2"], 4),
                _fmt_float(model["adj_r2"], 4),
                _fmt_float(model["f"], 4),
                _fmt_p(model["f_p"]),
                _fmt_float(model["aic"], 2),
                _fmt_float(model["bic"], 2),
            ])
        except Exception as exc:
            rows.append([f"M{i}", " + ".join(names), "-", "-", "-", str(exc), "-", "-"])
    return {"header": ["模型", "自变量", "R²", "调整 R²", "F", "p", "AIC", "BIC"], "rows": rows}


def _residual_table(data: pd.DataFrame, y_col: str, model: Dict[str, object]) -> Dict[str, object]:
    rows = []
    limit = min(12, model["n"])
    for i in range(limit):
        rows.append([
            str(data.index[i]),
            _fmt_float(data[y_col].iloc[i], 4),
            _fmt_float(model["fitted"][i], 4),
            _fmt_float(model["resid"][i], 4),
            _fmt_float(model["std_resid"][i], 4),
        ])
    return {"header": ["序号", "实际值", "拟合值", "残差", "标准化残差"], "rows": rows}


def _plot_simple_fit(data: pd.DataFrame, y_col: str, x_col: str, alpha: float) -> str:
    x = data[[x_col]].to_numpy(dtype=float)
    y = data[y_col].to_numpy(dtype=float)
    model = _fit_ols(y, x, [x_col], alpha)
    order = np.argsort(x[:, 0])

    fig, ax = plt.subplots(figsize=(8, 5))
    ax.scatter(x[:, 0], y, s=42, alpha=0.78, color="#2a5c8a", edgecolors="#16364f")
    ax.plot(x[order, 0], model["fitted"][order], color="#c0392b", linewidth=2.2)
    ax.set_title(f"一元线性回归: {y_col} ~ {x_col}")
    ax.set_xlabel(x_col)
    ax.set_ylabel(y_col)
    ax.grid(alpha=0.25)
    equation = f"{y_col} = {model['beta'][0]:.4f} + {model['beta'][1]:.4f} * {x_col}"
    ax.text(0.02, 0.96, equation, transform=ax.transAxes, va="top", fontsize=9,
            bbox={"boxstyle": "round,pad=0.35", "fc": "white", "ec": "#d6e0ea", "alpha": 0.9})
    return _fig_to_svg(fig)


def _plot_diagnostics(y: np.ndarray, model: Dict[str, object], y_col: str) -> str:
    fitted = model["fitted"]
    resid = model["resid"]
    std_resid = model["std_resid"]

    fig, axes = plt.subplots(1, 2, figsize=(11, 4.6))
    ax = axes[0]
    ax.scatter(fitted, y, s=38, alpha=0.78, color="#2a5c8a", edgecolors="#16364f")
    low = min(float(np.min(fitted)), float(np.min(y)))
    high = max(float(np.max(fitted)), float(np.max(y)))
    ax.plot([low, high], [low, high], color="#c0392b", linestyle="--", linewidth=1.6)
    ax.set_title("实际值 vs 拟合值")
    ax.set_xlabel("拟合值")
    ax.set_ylabel(y_col)
    ax.grid(alpha=0.25)

    ax = axes[1]
    ax.scatter(fitted, std_resid, s=38, alpha=0.78, color="#3d7a57", edgecolors="#214d34")
    ax.axhline(0, color="#c0392b", linestyle="--", linewidth=1.5)
    ax.axhline(2, color="#8a9aaa", linestyle=":", linewidth=1.0)
    ax.axhline(-2, color="#8a9aaa", linestyle=":", linewidth=1.0)
    ax.set_title("标准化残差 vs 拟合值")
    ax.set_xlabel("拟合值")
    ax.set_ylabel("标准化残差")
    ax.grid(alpha=0.25)
    return _fig_to_svg(fig)


def _plot_qq(model: Dict[str, object]) -> str:
    fig, ax = plt.subplots(figsize=(6.8, 5))
    st.probplot(model["std_resid"], dist="norm", plot=ax)
    ax.set_title("残差 Q-Q 图")
    ax.grid(alpha=0.25)
    return _fig_to_svg(fig)


def _placeholder_table(header: List[str], message: str) -> Dict[str, object]:
    return {"header": header, "rows": [[message] + ["-"] * (len(header) - 1)]}


def analyze(options=None) -> Dict[str, object]:
    try:
        opts = _to_py_dict(options)
        data_path = opts.get("data_path")
        if not data_path:
            return {"error": "请先在左侧上传数据文件。"}

        analysis_type = str(opts.get("analysis_type", "all")).strip().lower()
        if analysis_type not in {"all", "correlation", "simple", "multiple"}:
            analysis_type = "all"

        y_col = str(opts.get("y_col", "")).strip()
        x_cols = _split_columns(opts.get("x_cols"))
        alpha = float(opts.get("alpha") or 0.05)
        if not (0 < alpha < 1):
            alpha = 0.05

        if not y_col:
            return {"error": "请填写因变量 Y 的列名。"}
        if not x_cols:
            return {"error": "请填写至少 1 个自变量 X 的列名。"}

        # 去重并避免把 Y 同时作为 X。
        x_cols = list(dict.fromkeys(x_cols))
        x_cols = [c for c in x_cols if c != y_col]
        if not x_cols:
            return {"error": "自变量不能与因变量完全相同。"}

        data, selected_cols, dropped = _read_selected_data(data_path, y_col, x_cols)
        y = data[y_col].to_numpy(dtype=float)
        regression_cols = x_cols[:1] if analysis_type == "simple" else x_cols
        run_regression = analysis_type in {"all", "simple", "multiple"}

        svgs = [_plot_correlation_heatmap(data, selected_cols)]
        tables = [
            _correlation_table(data, selected_cols),
            _placeholder_table(["项", "估计值", "标准误", "t", "p", "CI 下限", "CI 上限"], "未运行回归模型"),
            _placeholder_table(["指标", "值"], "未运行回归模型"),
            _placeholder_table(["模型", "自变量", "R²", "调整 R²", "F", "p", "AIC", "BIC"], "未运行回归模型"),
            _placeholder_table(["序号", "实际值", "拟合值", "残差", "标准化残差"], "未运行回归模型"),
        ]
        metrics = {
            "n": str(len(data)),
            "p": str(len(regression_cols) if run_regression else len(x_cols)),
            "R": "--",
            "R2": "--",
            "adj_R2": "--",
            "RMSE": "--",
        }

        print(f"读取数据完成：有效样本 {len(data)} 行，选中变量 {', '.join(selected_cols)}。")
        if dropped:
            print(f"已删除包含缺失值或非数值转换失败的记录 {dropped} 行。")
        print("相关矩阵：下三角为 Pearson r，上三角为显著性标记（* p<=0.05，** p<=0.01，*** p<=0.001）。")

        if run_regression:
            x = data[regression_cols].to_numpy(dtype=float)
            model = _fit_ols(y, x, regression_cols, alpha)
            tables[1] = _coefficient_table(model, alpha)
            tables[2] = _summary_table(model, y_col)
            tables[3] = _nested_model_table(data, y_col, regression_cols, alpha)
            tables[4] = _residual_table(data, y_col, model)
            metrics = {
                "n": str(model["n"]),
                "p": str(model["p"]),
                "R": _fmt_float(model["multiple_r"], 4),
                "R2": _fmt_float(model["r2"], 4),
                "adj_R2": _fmt_float(model["adj_r2"], 4),
                "RMSE": _fmt_float(model["rmse"], 4),
            }
            if analysis_type in {"all", "simple"}:
                svgs.append(_plot_simple_fit(data, y_col, x_cols[0], alpha))
            elif len(regression_cols) == 1:
                svgs.append(_plot_simple_fit(data, y_col, regression_cols[0], alpha))
            svgs.append(_plot_diagnostics(y, model, y_col))
            svgs.append(_plot_qq(model))
            print(f"OLS 模型：{y_col} ~ {' + '.join(regression_cols)}")
            print(f"R^2={model['r2']:.4f}, 调整R^2={model['adj_r2']:.4f}, F检验p={_fmt_p(model['f_p'])}, RMSE={model['rmse']:.4f}")

        return {
            "svgs": svgs,
            "metrics": metrics,
            "tables": tables,
        }
    except Exception as exc:
        return {"error": str(exc)}

  <script type="text/python-src" data-module="Evaluation">
import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
import io
import json

def analyze(options):
    """综合分析主函数 - 支持层次分析法和综合分析法"""
    if not isinstance(options, dict):
        options = options.to_py()
    
    data_path = options.get('data_path')
    method_type = options.get('method_type', 'ahp')  # 'ahp' 或 'comprehensive'
    
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
    
    try:
        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}
    
    if df.empty:
        return {"error": "数据文件为空"}
    
    # 获取数值列
    numeric_cols = df.select_dtypes(include=[np.number]).columns.tolist()
    if len(numeric_cols) < 2:
        return {"error": "数据需要至少2个数值型指标列"}
    
    # 获取用户选择的指标（逗号分隔字符串 → 列表）
    selected_indicators = options.get('indicators', None)
    if selected_indicators and isinstance(selected_indicators, str):
        selected_indicators = [c.strip() for c in selected_indicators.split(',') if c.strip()]
    if selected_indicators and isinstance(selected_indicators, list) and len(selected_indicators) > 0:
        available_cols = [col for col in selected_indicators if col in numeric_cols]
        if len(available_cols) >= 2:
            numeric_cols = available_cols
    
    if method_type == 'ahp':
        return run_ahp(df, numeric_cols, options)
    else:
        return run_comprehensive(df, numeric_cols, options)


def run_ahp(df, numeric_cols, options):
    """层次分析法"""
    # 获取判断矩阵
    judgement_matrix_str = options.get('judgement_matrix', '')
    weights = None
    
    if judgement_matrix_str:
        try:
            judgement_matrix = json.loads(judgement_matrix_str)
            if len(judgement_matrix) == len(numeric_cols):
                weights = calculate_ahp_weights(judgement_matrix)
        except:
            pass
    
    if weights is None:
        weights = calculate_auto_weights(df, numeric_cols)
    
    # 标准化并计算得分
    normalized = normalize_minmax(df[numeric_cols].values)
    scores = np.dot(normalized, weights)
    sorted_indices = np.argsort(scores)[::-1]
    
    # 结果表格
    results_table = []
    for i, idx in enumerate(sorted_indices[:20]):
        results_table.append([
            i + 1,
            str(df.iloc[idx, 0]) if df.shape[1] > 0 else f"样本{idx+1}",
            f"{scores[idx]:.4f}"
        ])
    
    table_header = ["排名", "名称/ID", "综合得分"]
    weights_table = [[col, f"{weights[i]:.4f}"] for i, col in enumerate(numeric_cols)]
    
    # 创建可视化
    svgs = []
    bar_svg = create_score_bar_chart(scores[sorted_indices[:10]], results_table[:10])
    if bar_svg:
        svgs.append(bar_svg)
    
    return {
        "svgs": svgs,
        "tables": [
            {"header": table_header, "rows": results_table},
            {"header": ["指标名称", "权重"], "rows": weights_table}
        ],
        "metrics": {
            "样本数": len(df),
            "指标数": len(numeric_cols),
            "方法": "AHP",
            "最高分": f"{scores.max():.4f}",
            "最低分": f"{scores.min():.4f}",
            "平均分": f"{scores.mean():.4f}"
        }
    }


def run_comprehensive(df, numeric_cols, options):
    """综合分析法"""
    method = options.get('method', 'topsis')
    weight_method = options.get('weight_method', 'equal')
    
    # 计算权重
    if weight_method == 'equal':
        weights = np.ones(len(numeric_cols)) / len(numeric_cols)
    elif weight_method == 'std':
        data = df[numeric_cols].values
        stds = data.std(axis=0)
        weights = stds / (stds.sum() + 1e-10)
    else:
        weights = np.ones(len(numeric_cols)) / len(numeric_cols)
    
    # 标准化
    normalized = normalize_minmax(df[numeric_cols].values)
    
    # 计算得分
    if method == 'topsis':
        scores = topsis(normalized, weights)
    elif method == 'gray_relational':
        scores = gray_relational(normalized, weights)
    else:
        scores = np.dot(normalized, weights)
    
    sorted_indices = np.argsort(scores)[::-1]
    
    # 结果表格
    results_table = []
    for i, idx in enumerate(sorted_indices[:20]):
        results_table.append([
            i + 1,
            str(df.iloc[idx, 0]) if df.shape[1] > 0 else f"样本{idx+1}",
            f"{scores[idx]:.4f}"
        ])
    
    weights_table = [[col, f"{weights[i]:.4f}"] for i, col in enumerate(numeric_cols)]
    
    # 可视化
    svgs = []
    radar_svg = create_radar_chart(normalized[sorted_indices[:8]], numeric_cols, scores[sorted_indices[:8]])
    if radar_svg:
        svgs.append(radar_svg)
    
    dist_svg = create_score_distribution(scores)
    if dist_svg:
        svgs.append(dist_svg)
    
    method_names = {'topsis': 'TOPSIS', 'weighted_sum': '加权和法', 'gray_relational': '灰色关联'}
    
    return {
        "svgs": svgs,
        "tables": [
            {"header": ["排名", "名称/ID", "综合得分"], "rows": results_table},
            {"header": ["指标名称", "权重"], "rows": weights_table}
        ],
        "metrics": {
            "样本数": len(df),
            "指标数": len(numeric_cols),
            "分析方法": method_names.get(method, method),
            "最高分": f"{scores.max():.4f}",
            "最低分": f"{scores.min():.4f}",
            "平均分": f"{scores.mean():.4f}"
        }
    }


def normalize_minmax(data):
    """Min-Max标准化"""
    min_vals = data.min(axis=0)
    max_vals = data.max(axis=0)
    ranges = max_vals - min_vals
    ranges[ranges == 0] = 1
    return (data - min_vals) / ranges


def calculate_auto_weights(df, numeric_cols):
    """自动计算权重（标准差法）"""
    data = df[numeric_cols].values
    data_norm = (data - data.min(axis=0)) / (data.max(axis=0) - data.min(axis=0) + 1e-10)
    stds = data_norm.std(axis=0)
    weights = stds / (stds.sum() + 1e-10)
    return weights


def calculate_ahp_weights(matrix):
    """AHP几何平均法计算权重"""
    matrix = np.array(matrix)
    n = len(matrix)
    product = np.prod(matrix, axis=1)
    geometric_mean = product ** (1/n)
    weights = geometric_mean / geometric_mean.sum()
    # 简单一致性检查
    lambda_max = np.sum(np.dot(matrix, weights) / weights) / n
    ci = (lambda_max - n) / (n - 1) if n > 1 else 0
    cr = ci / 0.9 if n == 3 else (ci / 1.12 if n == 4 else ci / 1.24 if n == 5 else ci)
    return weights


def topsis(data, weights):
    """TOPSIS方法"""
    weighted = data * weights
    ideal_best = weighted.max(axis=0)
    ideal_worst = weighted.min(axis=0)
    dist_best = np.sqrt(((weighted - ideal_best) ** 2).sum(axis=1))
    dist_worst = np.sqrt(((weighted - ideal_worst) ** 2).sum(axis=1))
    return dist_worst / (dist_best + dist_worst + 1e-10)


def gray_relational(data, weights):
    """灰色关联分析"""
    reference = data.max(axis=0)
    diff = np.abs(data - reference)
    min_diff = diff.min(axis=0)
    max_diff = diff.max(axis=0)
    rho = 0.5
    rel_coef = (min_diff + rho * max_diff) / (diff + rho * max_diff + 1e-10)
    return np.dot(rel_coef, weights)


def create_score_bar_chart(scores, labels):
    """创建得分条形图"""
    try:
        fig, ax = plt.subplots(figsize=(10, 5))
        ranks = range(1, len(scores) + 1)
        colors = plt.cm.RdYlGn_r(np.linspace(0.2, 0.8, len(scores)))
        bars = ax.bar(ranks, scores, color=colors, edgecolor='white', linewidth=0.5)
        ax.set_xlabel('Rank', fontsize=11)
        ax.set_ylabel('Comprehensive Score', fontsize=11)
        ax.set_title('Top 10 Samples Ranking', fontsize=13, fontweight='bold')
        ax.set_xticks(ranks)
        ax.set_ylim(0, 1.05)
        for bar, score in zip(bars, scores):
            ax.text(bar.get_x() + bar.get_width()/2, bar.get_height() + 0.01,
                   f'{score:.3f}', ha='center', va='bottom', fontsize=9)
        fig.tight_layout()
        buf = io.BytesIO()
        fig.savefig(buf, format='svg')
        plt.close(fig)
        return buf.getvalue().decode()
    except:
        return None


def create_radar_chart(data, labels, scores):
    """创建雷达图"""
    if len(data) == 0:
        return None
    try:
        fig, ax = plt.subplots(figsize=(9, 7), subplot_kw={'projection': 'polar'})
        angles = np.linspace(0, 2 * np.pi, len(labels), endpoint=False).tolist()
        angles += angles[:1]
        colors = plt.cm.Set3(np.linspace(0, 1, min(len(data), 8)))
        for i in range(min(len(data), 8)):
            values = data[i].tolist()
            values += values[:1]
            ax.plot(angles, values, 'o-', linewidth=1.5, color=colors[i],
                   label=f'#{i+1} (Score: {scores[i]:.3f})')
            ax.fill(angles, values, alpha=0.1, color=colors[i])
        ax.set_xticks(angles[:-1])
        ax.set_xticklabels(labels, size=8)
        ax.set_ylim(0, 1)
        ax.legend(loc='upper right', bbox_to_anchor=(1.3, 1.0), fontsize=8)
        ax.set_title('Top 8 Samples - Radar Chart', size=12, pad=20)
        fig.tight_layout()
        buf = io.BytesIO()
        fig.savefig(buf, format='svg', bbox_inches='tight')
        plt.close(fig)
        return buf.getvalue().decode()
    except:
        return None


def create_score_distribution(scores):
    """创建得分分布图"""
    try:
        fig, axes = plt.subplots(1, 2, figsize=(12, 4))
        axes[0].hist(scores, bins=15, edgecolor='black', alpha=0.7, color='steelblue')
        axes[0].set_xlabel('Score')
        axes[0].set_ylabel('Frequency')
        axes[0].set_title('Score Distribution')
        axes[0].axvline(scores.mean(), color='red', linestyle='--', label=f'Mean: {scores.mean():.3f}')
        axes[0].legend()
        sorted_scores = np.sort(scores)[::-1]
        axes[1].plot(range(1, len(sorted_scores) + 1), sorted_scores,
                    'o-', color='steelblue', linewidth=1.5, markersize=3)
        axes[1].set_xlabel('Rank')
        axes[1].set_ylabel('Score')
        axes[1].set_title('Score Rank Curve')
        axes[1].grid(True, alpha=0.3)
        fig.tight_layout()
        buf = io.BytesIO()
        fig.savefig(buf, format='svg')
        plt.close(fig)
        return buf.getvalue().decode()
    except:
        return None

import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
from sklearn.preprocessing import StandardScaler
from sklearn.decomposition import FactorAnalysis
import io


def analyze(options):
    if not isinstance(options, dict):
        options = options.to_py()

    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

    try:
        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}

    first_col = df.columns[0]
    if df[first_col].dtype == 'object':
        sample_labels = df[first_col].tolist()
        df_numeric = df.drop(columns=[first_col])
    else:
        sample_labels = [f"S{i+1}" for i in range(len(df))]
        df_numeric = df.copy()

    df_numeric = df_numeric.select_dtypes(include=[np.number]).dropna()
    if df_numeric.shape[1] < 3:
        return {"error": f"数值变量仅 {df_numeric.shape[1]} 个，至少需要 3 个"}

    n_samples, n_features = df_numeric.shape
    feature_names = df_numeric.columns.tolist()

    scaler = StandardScaler()
    X_scaled = scaler.fit_transform(df_numeric.values)

    corr = np.corrcoef(X_scaled, rowvar=False)
    eig_vals = np.linalg.eigvalsh(corr)[::-1]

    n_factors = int(np.sum(eig_vals > 1))
    max_factors = min(n_features, n_samples - 1)
    if n_factors < 1:
        n_factors = min(2, max_factors)
    elif n_factors > max_factors:
        n_factors = max_factors

    svgs = []

    fig1, ax1 = plt.subplots(figsize=(8, 4))
    ax1.plot(range(1, n_features + 1), eig_vals, 'bo-', markersize=6, linewidth=2)
    ax1.axhline(y=1, color='r', linestyle='--', alpha=0.7, label='特征值=1')
    ax1.set_xlabel('因子序号', fontsize=11)
    ax1.set_ylabel('特征值', fontsize=11)
    ax1.set_title('碎石图 (Scree Plot)', fontsize=13, fontweight='bold')
    ax1.legend(fontsize=9)
    ax1.grid(alpha=0.3, linestyle='--')
    ax1.set_xticks(range(1, n_features + 1))
    fig1.tight_layout()
    buf = io.BytesIO()
    fig1.savefig(buf, format='svg')
    plt.close(fig1)
    svgs.append(buf.getvalue().decode())

    fa = FactorAnalysis(n_components=n_factors, random_state=42, rotation='varimax')
    fa.fit(X_scaled)
    loadings = fa.components_.T
    scores = fa.transform(X_scaled)

    communality = np.sum(loadings**2, axis=1)

    variance = np.sum(loadings**2, axis=0)
    total_var = np.sum(variance)
    if total_var > 0:
        proportion_var = variance / total_var
    else:
        proportion_var = np.ones(n_factors) / n_factors
    cumulative_var = np.cumsum(proportion_var)

    factor_names = [f'Factor {i+1}' for i in range(n_factors)]

    fig2, ax2 = plt.subplots(figsize=(8, max(4, n_features * 0.35)))
    im = ax2.imshow(loadings, aspect='auto', cmap='coolwarm', vmin=-1, vmax=1)
    ax2.set_xticks(range(n_factors))
    ax2.set_xticklabels(factor_names, fontsize=10)
    ax2.set_yticks(range(n_features))
    ax2.set_yticklabels(feature_names, fontsize=10)
    ax2.set_title('旋转后因子载荷热图', fontsize=13, fontweight='bold')
    for i in range(n_features):
        for j in range(n_factors):
            val = loadings[i, j]
            c = 'white' if abs(val) > 0.5 else 'black'
            ax2.text(j, i, f'{val:.2f}', ha='center', va='center', fontsize=8, color=c)
    fig2.colorbar(im, ax=ax2, shrink=0.8)
    fig2.tight_layout()
    buf = io.BytesIO()
    fig2.savefig(buf, format='svg')
    plt.close(fig2)
    svgs.append(buf.getvalue().decode())

    if n_factors >= 2:
        fig3, ax3 = plt.subplots(figsize=(8, 6))
        ax3.scatter(scores[:, 0], scores[:, 1], c='steelblue', s=60, alpha=0.7, edgecolors='#1e3b5c')
        for i, lbl in enumerate(sample_labels[:len(scores)]):
            ax3.annotate(lbl, (scores[i, 0], scores[i, 1]),
                        textcoords="offset points", xytext=(5, 5), fontsize=7, alpha=0.8)
        ax3.axhline(y=0, color='grey', linestyle='--', alpha=0.5)
        ax3.axvline(x=0, color='grey', linestyle='--', alpha=0.5)
        ax3.set_xlabel('Factor 1', fontsize=11)
        ax3.set_ylabel('Factor 2', fontsize=11)
        ax3.set_title('前两个因子得分图（旋转后）', fontsize=13, fontweight='bold')
        ax3.grid(alpha=0.3, linestyle='--')
        fig3.tight_layout()
        buf = io.BytesIO()
        fig3.savefig(buf, format='svg')
        plt.close(fig3)
        svgs.append(buf.getvalue().decode())

    loadings_header = ['变量'] + factor_names + ['共同度']
    loadings_rows = []
    for i, vn in enumerate(feature_names):
        row = [vn] + [f'{loadings[i, j]:.4f}' for j in range(n_factors)] + [f'{communality[i]:.4f}']
        loadings_rows.append(row)

    var_header = ['因子', '方差', '贡献率', '累积贡献率']
    var_rows = []
    for j in range(n_factors):
        var_rows.append([
            f'Factor {j+1}',
            f'{variance[j]:.4f}',
            f'{proportion_var[j]:.1%}',
            f'{cumulative_var[j]:.1%}'
        ])

    scores_header = ['样本'] + [f'F{j+1}' for j in range(n_factors)]
    scores_rows = []
    for i in range(min(10, n_samples)):
        row = [sample_labels[i]] + [f'{scores[i, j]:.4f}' for j in range(n_factors)]
        scores_rows.append(row)

    return {
        "svgs": svgs,
        "metrics": {
            "提取因子数": n_factors,
            "变量数": n_features,
            "样本数": n_samples,
            "累积贡献率": f"{cumulative_var[-1]:.1%}"
        },
        "tables": [
            {"header": loadings_header, "rows": loadings_rows},
            {"header": var_header, "rows": var_rows},
            {"header": scores_header, "rows": scores_rows},
        ],
    }

        df = pd.read_csv(data_path)

        df_numeric = df.copy()

    df_numeric = df_numeric.select_dtypes(include=[np.number])

        scale = (np.max(np.abs(scores[:, :2])) * 0.9 /

        ax4.set_xlabel(f'PC1 ({explained_var[0]:.1%})', fontsize=11)
        ax4.set_ylabel(f'PC2 ({explained_var[1]:.1%})', fontsize=11)
        ax4.set_title('PCA biplot', fontsize=13, fontweight='bold')
        ax4.legend(loc='upper right', fontsize=9)
    else:
        ax4.text(0.5, 0.5, 'Unable to draw biplot', transform=ax4.transAxes,

    ax4.axhline(y=0, color='grey', linestyle='--', alpha=0.4, zorder=1)
    ax4.axvline(x=0, color='grey', linestyle='--', alpha=0.4, zorder=1)
    ax4.grid(alpha=0.3, linestyle='--', zorder=0)
    fig4.tight_layout()
    buf = io.BytesIO()
    fig4.savefig(buf, format='svg')
    plt.close(fig4)
    svgs.append(buf.getvalue().decode())

    # 载荷矩阵
    table = []
    for i, vn in enumerate(feature_names):
        row = [vn] + [f'{loadings[i, j]:.4f}' for j in range(n_components)]
        table.append(row)
    table_header = ['variable'] + pc_names

    # 得分矩阵
    scores_table = []
    for i, lbl in enumerate(sample_labels):
        row = [lbl] + [f'{scores[i, j]:.4f}' for j in range(n_components)]
        scores_table.append(row)
    scores_header = ['sample'] + pc_names

    return {
        "svgs": svgs,
        "metrics": {
            "samples num": n_samples,
            "variable num": n_features,
            "PC num": n_components,
            "Cumulative variance": f"{cum_var[-1]:.1%}"
        },
        "tables": [
            {"header": table_header, "rows": table},
            {"header": scores_header, "rows": scores_table},
        ],
    }

import pandas as pd

def generate_visualization(options):

    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
